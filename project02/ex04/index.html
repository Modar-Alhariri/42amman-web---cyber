<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Box Model</h1>

    <div class="comparison">

        <div class="box content-box">
            <h2>content-box</h2>
            <p>Width excludes padding and border.</p>
        </div>

        <div class="box border-box">
            <h2>border-box</h2>
            <p>Width includes padding and border.</p>
        </div>

    </div>

</body>
</html>
