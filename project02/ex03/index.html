<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03 - Colors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Models</h1>

    <div class="palette">

        <div class="swatch named">
            <p>Named Color</p>
        </div>

        <div class="swatch hex">
            <p>HEX</p>
        </div>

        <div class="swatch rgb">
            <p>RGB</p>
        </div>

        <div class="swatch rgba">
            <p>RGBA</p>
        </div>

    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">

        <div class="opacity-box">
            <div class="child">
                Child
            </div>
            <p>opacity: 0.5</p>
        </div>

        <div class="rgba-box">
            <div class="child">
                Child
            </div>
            <p>rgba(..., 0.5)</p>
        </div>

    </div>

</body>
</html>
