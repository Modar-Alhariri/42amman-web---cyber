<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 02 - CSS Shapes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Shapes</h1>

    <div class="shapes">

        <div class="shape-wrapper">
            <div class="square"></div>
            <p>Square</p>
        </div>

        <div class="shape-wrapper">
            <div class="rectangle"></div>
            <p>Rectangle</p>
        </div>

        <div class="shape-wrapper">
            <div class="circle"></div>
            <p>Circle</p>
        </div>

        <div class="shape-wrapper">
            <div class="pill"></div>
            <p>Capsule</p>
        </div>

        <div class="shape-wrapper">
            <div class="triangle"></div>
            <p>Triangle</p>
        </div>

    </div>

</body>
</html>
